<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Mario</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;border-radius:12px;background:#38bdf8}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 22px;font-weight:700;font-size:clamp(14px,2.4vw,24px);pointer-events:none;text-shadow:0 2px 0 rgba(15,23,42,.35)}
#toast{position:absolute;top:13%;left:50%;transform:translateX(-50%);max-width:80%;padding:10px 18px;border-radius:12px;background:rgba(15,23,42,.88);text-align:center;font-size:clamp(12px,1.9vw,18px);line-height:1.45;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:rgba(15,23,42,.78);border-radius:12px;padding:20px}
#overlay.hide{display:none}
h1{font-size:clamp(28px,6vw,56px);letter-spacing:-.02em}
#msg{opacity:.88;font-size:clamp(13px,2vw,18px);line-height:1.6;white-space:pre-line}
button{font:inherit;font-weight:700;font-size:clamp(14px,2.2vw,20px);padding:.7em 1.8em;border:0;border-radius:999px;background:#f43f5e;color:#fff;cursor:pointer;transition:transform .12s,background .12s}
button:hover{background:#e11d48;transform:scale(1.05)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud"><span id="score">Điểm: 0</span><span id="status"></span><span id="lives">♥♥♥</span></div>
  <div id="toast"></div>
  <div id="overlay">
    <h1 id="title">Mini Mario</h1>
    <p id="msg"></p>
    <button id="btn">Bắt đầu</button>
  </div>
</div>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 960, H = 540, GY = 440;
cv.width = W; cv.height = H;
const GRAV = .6, JUMP = -13.5, MAXV = 5, ACC = .5, FRIC = .82;
const START_MSG = '← → di chuyển · Space hoặc ↑ nhảy · X bắn lửa (khi có hoa lửa)\nNhảy lên đầu quái để diệt · Quái có thể chui ra từ ống\nNhảy húc khối ? từ bên dưới để lấy vật phẩm: 🍄 bự · ⭐ bất tử · 🔥 bắn lửa\nCẩn thận gai nhọn và dơi bay — đi càng xa, game càng khó!';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const lvl = () => 1 + Math.floor(maxX / 3000);   // cấp độ tăng mỗi 3000px
const spd = () => Math.min(3.5, 1 + maxX / 6000);  // hệ số tốc độ quái: càng đi xa càng nhanh (tối đa x3.5)
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Enter' && state !== 'play') start();
});
addEventListener('keyup', e => keys[e.code] = false);

let state = 'ready', solids, enemies, coins, items, fires, hazards, curLvl, genX, p, camX, bonus, maxX, lives, safeX, t = 0, best = 0, toastTimer;
try { best = +localStorage.getItem('miniMarioBest') || 0; } catch (e) {}

// ---- Dựng màn chơi ----
function addGround(x, w) { solids.push({ x, y: GY, w, h: H - GY, t: 'g' }); }
function addBlock(x) { solids.push({ x, y: GY - 130, w: 36, h: 36, t: 'q', used: false }); }
function addPipe(x, h, forcePlant) {                 // ống có thể có quái chui ra
  solids.push({ x, y: GY - h, w: 56, h, t: 'p' });
  if (forcePlant || Math.random() < .65)
    enemies.push({ k: 'p', x: x + 12, w: 32, h: 36, py: GY - h, y: GY - h, off: rand(0, 220) | 0, ext: 0, sp: spd() });
}

function reset() {
  maxX = 0; solids = []; enemies = []; coins = []; items = []; fires = []; hazards = []; curLvl = 1;
  addGround(0, 700); addBlock(320); addPipe(560, 60, true); genX = 700;
  p = { x: 60, y: GY - 40, w: 28, h: 40, vx: 0, vy: 0, on: false, face: 1, inv: 0, big: false, star: 0, ammo: 0, cd: 0 };
  camX = 0; bonus = 0; maxX = 0; lives = 3; safeX = 0;
}

function gen() {
  if (genX > 700 && Math.random() < .45) {
    const gw = rand(90, 150) + Math.min(30, (lvl() - 1) * 10);
    if (Math.random() < .5) {
      solids.push({ x: genX - 20, y: GY - 120, w: gw + 40, h: 18, t: 'b' });
      for (let i = 0; i < 3; i++) coins.push({ x: genX + gw / 2 - 30 + i * 30, y: GY - 150 });
    }
    genX += gw;
  }
  const w = rand(380, 640), x = genX;
  addGround(x, w);
  let pipeX = -999;
  if (Math.random() < .6) { pipeX = x + rand(280, w - 90); addPipe(pipeX, rand(50, 85)); }
  const r = Math.random();
  if (r < .3) {                                       // cầu nhỏ + xu
    const pw = rand(100, 140), px = x + rand(30, 110), py = GY - rand(125, 145);
    solids.push({ x: px, y: py, w: pw, h: 18, t: 'b' });
    for (let i = 0; i < 3; i++) coins.push({ x: px + 22 + i * 30, y: py - 26 });
  } else if (r < .65 - .06 * Math.min(lvl() - 1, 4)) addBlock(x + rand(60, 200));    // khối ? chứa vật phẩm
  const n = Math.random() < .7 ? (Math.random() < .4 + .1 * Math.min(lvl() - 1, 4) ? 2 : 1) : 0;
  for (let i = 0; i < n; i++) {
    const ex = x + rand(120, w - 60);
    if (Math.abs(ex - pipeX) < 90) continue;
    enemies.push({ k: 'g', x: ex, y: GY - 30, w: 30, h: 30, vx: -1.1 * spd(), minX: x + 10, maxX: x + w - 40 });
  }
  const L = lvl();
  if (Math.random() < .35 + .08 * Math.min(L - 1, 4)) {            // gai nhọn: không thể nhảy lên đầu
    const sx = x + rand(120, w - 120);
    if (Math.abs(sx - pipeX) > 110) hazards.push({ x: sx, y: GY - 16, w: 34 + (L > 2 && Math.random() < .5 ? 34 : 0), h: 16 });
  }
  if (L >= 2 && Math.random() < .35 + .1 * Math.min(L - 2, 3))     // dơi bay từ cấp 2
    enemies.push({ k: 'f', x: x + rand(100, w - 100), w: 30, h: 24, by: GY - rand(90, 140), y: GY - 100, vx: -1.5 * spd(), sp: spd(), ph: rand(0, 6), minX: x - 60, maxX: x + w });
  genX += w;
}

// ---- Quái, vật phẩm ----
const ext = e => { const q = (t * e.sp + e.off) % 220; return q < 60 ? 0 : q < 90 ? (q - 60) / 30 : q < 170 ? 1 : q < 200 ? (200 - q) / 30 : 0; };
const hidden = e => e.k === 'p' && e.ext < .3;
const kill = (e, pts) => { e.dead = true; bonus += pts; };

function grow() { p.big = true; p.w = 42; p.h = 60; p.y -= 20; p.x -= 7; }
function shrink() { p.big = false; p.w = 28; p.h = 40; p.y += 20; p.x += 7; p.inv = 100; }

function toast(title, text) {
  const el = $('toast'); el.innerHTML = '<b>' + title + '</b><br>' + text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

function collect(k) {
  bonus += 20;
  if (k === 'big') {
    if (p.big) bonus += 100; else grow();
    toast('🍄 Nấm bự', 'Bạn đã to lên! Va chạm quái lần tới chỉ bị thu nhỏ lại, chưa mất mạng.');
  } else if (k === 'star') {
    p.star = 420;
    toast('⭐ Sao bất tử', 'Bất tử 7 giây: cứ lao vào quái để tiêu diệt. Lưu ý: rơi xuống hố vẫn chết!');
  } else {
    p.ammo = Math.min(p.ammo + 8, 20);
    toast('🔥 Hoa lửa', 'Nhấn phím X để bắn lửa theo hướng đang nhìn. Số viên còn lại hiện ở giữa phía trên.');
  }
}

function hurt() {                                   // trả về true nếu mất mạng
  if (p.inv > 0 || p.star > 0) return false;
  if (p.big) { shrink(); return false; }
  die(); return true;
}

// ---- Cập nhật logic (60 lần/giây) ----
function update() {
  t++;
  while (genX < camX + W + 400) gen();

  const dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  if (dir) { p.vx += dir * ACC; p.face = dir; } else p.vx *= FRIC;
  p.vx = Math.max(-MAXV, Math.min(MAXV, p.vx));
  if (Math.abs(p.vx) < .05) p.vx = 0;
  if ((keys.Space || keys.ArrowUp) && p.on) { p.vy = JUMP; p.on = false; }
  p.vy = Math.min(p.vy + GRAV, 16);

  if (p.cd > 0) p.cd--;
  if ((keys.KeyX || keys.KeyZ) && p.ammo > 0 && p.cd <= 0) {
    p.ammo--; p.cd = 18;
    fires.push({ x: p.x + (p.face > 0 ? p.w : -10), y: p.y + p.h * .4, w: 10, h: 10, vx: 8 * p.face, vy: -1, life: 0 });
  }

  p.x += p.vx;
  if (p.x < 0) p.x = 0;
  for (const s of solids) if (hit(p, s)) {
    if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w;
    p.vx = 0;
  }
  p.y += p.vy; p.on = false;
  for (const s of solids) if (hit(p, s)) {
    if (p.vy > 0) { p.y = s.y - p.h; p.on = true; if (s.t === 'g') safeX = s.x; }
    else {
      p.y = s.y + s.h;
      if (s.t === 'q' && !s.used) {                 // húc khối ? từ bên dưới -> ra vật phẩm
        s.used = true;
        items.push({ kind: ['big', 'star', 'gun'][Math.random() * 3 | 0], x: s.x + 6, by: s.y, y: s.y, w: 24, h: 24, age: 0 });
      }
    }
    p.vy = 0;
  }
  if (p.inv > 0) p.inv--;
  if (p.star > 0) p.star--;
  maxX = Math.max(maxX, p.x);
  const L = lvl();
  if (L > curLvl) { curLvl = L; bonus += 100; toast('⚡ Cấp ' + L, L === 2 ? 'Dơi bay xuất hiện, gai nhọn nhiều hơn!' : 'Quái chạy nhanh hơn nữa, hố rộng hơn, ít khối ? hơn!'); }
  if (p.y > H + 60) return die();
  for (const h of hazards) if (h.x > camX - 100 && h.x < camX + W + 100 && hit(p, { x: h.x + 4, y: h.y + 4, w: h.w - 8, h: h.h - 4 }) && hurt()) return;

  for (const it of items) {
    if (it.got) continue;
    it.age++; it.y = it.by - 26 * Math.min(1, it.age / 12);
    if (hit(p, it)) { it.got = true; collect(it.kind); }
  }

  for (const e of enemies) {
    if (e.x < camX - 200 || e.x > camX + W + 200) continue;
    if (e.k === 'p') { e.ext = ext(e); e.y = e.py - e.h * e.ext; }
    else if (e.k === 'f') {
      e.x += e.vx; if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
      e.y = e.by + Math.sin((t * e.sp + e.ph * 30) / 20) * 35;
    } else {
      e.x += e.vx;
      if (e.x < e.minX || e.x > e.maxX) { e.vx *= -1; e.x = Math.max(e.minX, Math.min(e.maxX, e.x)); }
      for (const s of solids) if (s.t === 'p' && hit(e, s)) { e.x -= e.vx; e.vx *= -1; break; }
    }
    if (e.dead || hidden(e)) continue;
    if (hit(p, e)) {
      if (p.star > 0) kill(e, 50);
      else if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 10) { kill(e, e.k === 'p' ? 100 : 50); p.vy = -9; }   // nhảy lên đầu quái
      else if (hurt()) return;
    }
  }

  for (const f of fires) {
    f.x += f.vx; f.vy += .3; f.y += f.vy; f.life++;
    for (const s of solids) if (hit(f, s)) {
      if (f.vy > 0 && f.y + f.h - f.vy <= s.y + 2) { f.y = s.y - f.h; f.vy = -4.5; } else f.dead = true;
    }
    for (const e of enemies) if (!e.dead && !hidden(e) && hit(f, e)) { kill(e, 30); f.dead = true; }
    if (f.life > 140) f.dead = true;
  }
  fires = fires.filter(f => !f.dead);
  enemies = enemies.filter(e => !e.dead);
  for (const c of coins) if (!c.got && hit(p, { x: c.x - 10, y: c.y - 10, w: 20, h: 20 })) { c.got = true; bonus += 10; }

  camX += (Math.max(0, p.x - 320) - camX) * .12;
}

function die() {
  lives--;
  if (lives <= 0) return gameOver();
  p.big = false; p.w = 28; p.h = 40; p.star = 0; p.ammo = 0; fires = [];
  p.x = safeX + 30; p.y = GY - p.h; p.vx = p.vy = 0; p.inv = 120;
  enemies = enemies.filter(e => Math.abs(e.x - p.x) > 250);
}

const score = () => Math.floor(maxX / 10) + bonus;

function gameOver() {
  state = 'over';
  const s = score();
  if (s > best) { best = s; try { localStorage.setItem('miniMarioBest', s); } catch (e) {} }
  showOverlay('Game Over', `Điểm: ${s} · Kỷ lục: ${best}`, 'Chơi lại');
}

function showOverlay(title, msg, btn) {
  $('title').textContent = title; $('msg').textContent = msg; $('btn').textContent = btn;
  $('overlay').classList.remove('hide'); $('btn').focus();
}

function start() { reset(); state = 'play'; $('toast').classList.remove('show'); $('overlay').classList.add('hide'); $('btn').blur(); }
$('btn').onclick = start;

// ---- Vẽ ----
const sky = ctx.createLinearGradient(0, 0, 0, H);
sky.addColorStop(0, '#38bdf8'); sky.addColorStop(1, '#e0f2fe');

function star(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

function drawItem(it) {
  const cx = it.x + 12, cy = it.y + 12;
  if (it.kind === 'big') {
    ctx.fillStyle = '#fde68a'; ctx.fillRect(cx - 7, cy + 2, 14, 10);
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(cx, cy + 3, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 5, cy - 3, 3, 0, 7); ctx.arc(cx + 5, cy - 3, 3, 0, 7); ctx.fill();
  } else if (it.kind === 'star') {
    ctx.fillStyle = '#fbbf24'; star(cx, cy, 14 + Math.sin(t / 8) * 2);
  } else {
    ctx.fillStyle = '#16a34a'; ctx.fillRect(cx - 2, cy, 4, 12);
    ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(cx, cy - 2, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(cx, cy - 2, 4, 0, 7); ctx.fill();
  }
}

function drawEnemy(e) {
  if (e.k === 'p') {                                 // quái ống: cắt phần nằm trong ống
    if (e.ext <= 0) return;
    ctx.save(); ctx.beginPath(); ctx.rect(e.x - 6, e.py - 120, e.w + 12, 120); ctx.clip();
    const cx = e.x + e.w / 2;
    ctx.fillStyle = '#16a34a'; ctx.fillRect(cx - 4, e.y + 18, 8, e.h);
    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(cx, e.y + 17, 17, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 8, e.y + 10, 3, 0, 7); ctx.arc(cx + 8, e.y + 10, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#450a0a'; ctx.fillRect(cx - 9, e.y + 17, 18, 6);
    ctx.restore(); return;
  }
  if (e.k === 'f') {                                 // dơi
    const cx = e.x + 15, cy = e.y + 12, w = Math.sin(t / 3) * 8;
    ctx.fillStyle = '#4c1d95';
    ctx.beginPath(); ctx.moveTo(cx - 4, cy); ctx.lineTo(cx - 24, cy - 8 + w); ctx.lineTo(cx - 14, cy + 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 24, cy - 8 + w); ctx.lineTo(cx + 14, cy + 8); ctx.fill();
    ctx.fillStyle = '#6d28d9'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#fef08a'; ctx.fillRect(cx - 6, cy - 3, 4, 4); ctx.fillRect(cx + 2, cy - 3, 4, 4);
    return;
  }
  ctx.fillStyle = '#7c2d12'; ctx.beginPath(); ctx.arc(e.x + 15, e.y + 18, 15, Math.PI, 0); ctx.fill();
  ctx.fillRect(e.x, e.y + 16, 30, 8);
  ctx.fillStyle = '#1c1917'; const f = Math.sin(t / 6 * Math.sign(e.vx)) * 3;
  ctx.fillRect(e.x + 2 + f, e.y + 24, 10, 6); ctx.fillRect(e.x + 18 - f, e.y + 24, 10, 6);
  ctx.fillStyle = '#fff'; ctx.fillRect(e.x + 7, e.y + 10, 6, 7); ctx.fillRect(e.x + 17, e.y + 10, 6, 7);
  ctx.fillStyle = '#000'; ctx.fillRect(e.x + 9, e.y + 12, 3, 4); ctx.fillRect(e.x + 19, e.y + 12, 3, 4);
}

function drawPlayer() {
  const k = p.big ? 1.5 : 1, step = p.on ? Math.sin(t / 3) * Math.min(Math.abs(p.vx), 4) * 1.6 : 0;
  ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h);
  if (p.star > 0 && (p.star > 90 || Math.floor(t / 4) % 2)) {
    ctx.fillStyle = `hsla(${t * 20 % 360},100%,60%,.45)`; ctx.beginPath(); ctx.arc(0, -p.h / 2, p.h * .8, 0, 7); ctx.fill();
  }
  ctx.scale(k * p.face, k);
  const shirt = p.star > 0 ? `hsl(${t * 25 % 360},90%,55%)` : '#ef4444';
  ctx.fillStyle = '#1d4ed8'; ctx.fillRect(-10 + step, -10, 8, 10); ctx.fillRect(2 - step, -10, 8, 10);
  ctx.fillStyle = shirt; ctx.fillRect(-12, -26, 24, 16);
  ctx.fillStyle = '#2563eb'; ctx.fillRect(-10, -18, 20, 10);
  ctx.fillStyle = '#fcd9b6'; ctx.fillRect(-11, -35, 22, 12);
  ctx.fillStyle = shirt; ctx.fillRect(-13, -40, 26, 8); ctx.fillRect(2, -35, 12, 4);
  ctx.fillStyle = '#111827'; ctx.fillRect(4, -31, 4, 4);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#bbf7d0';
  for (let i = -1; i < 5; i++) { const hx = i * 380 - (camX * .3 % 380); ctx.beginPath(); ctx.ellipse(hx + 190, GY, 190, 110, 0, Math.PI, 0); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = -1; i < 4; i++) {
    const cx = i * 330 - (camX * .15 % 330) + 120, cy = 90 + (i & 1) * 50;
    ctx.beginPath(); ctx.arc(cx, cy, 24, 0, 7); ctx.arc(cx + 28, cy + 6, 30, 0, 7); ctx.arc(cx + 58, cy, 22, 0, 7); ctx.fill();
  }

  ctx.save(); ctx.translate(-Math.round(camX), 0);
  for (const s of solids) {
    if (s.x > camX + W || s.x + s.w < camX) continue;
    if (s.t === 'g') { ctx.fillStyle = '#334155'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#22c55e'; ctx.fillRect(s.x, s.y, s.w, 10); }
    else if (s.t === 'p') { ctx.fillStyle = '#0d9488'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#2dd4bf'; ctx.fillRect(s.x, s.y, s.w, 14); ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(s.x + s.w - 10, s.y + 14, 10, s.h - 14); }
    else if (s.t === 'q') {
      ctx.fillStyle = s.used ? '#a16207' : '#fbbf24'; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = s.used ? '#713f12' : '#b45309'; ctx.lineWidth = 3; ctx.strokeRect(s.x + 1.5, s.y + 1.5, s.w - 3, s.h - 3);
      if (!s.used) { ctx.fillStyle = '#92400e'; ctx.font = 'bold 24px system-ui'; ctx.textAlign = 'center'; ctx.fillText('?', s.x + s.w / 2, s.y + 26); }
    } else { ctx.fillStyle = '#f59e0b'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#b45309'; ctx.fillRect(s.x, s.y + s.h - 5, s.w, 5); for (let x = s.x + 20; x < s.x + s.w; x += 20) ctx.fillRect(x, s.y, 2, s.h - 5); }
  }
  for (const c of coins) {
    if (c.got || c.x < camX - 20 || c.x > camX + W + 20) continue;
    const sq = Math.abs(Math.cos(t / 15 + c.x));
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 9 * sq + 2, 10, 0, 0, 7); ctx.fill();
  }
  for (const h of hazards) {
    if (h.x < camX - 80 || h.x > camX + W + 80) continue;
    ctx.fillStyle = '#f1f5f9'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5;
    for (let x = h.x; x < h.x + h.w - 1; x += 17) { ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x + 8.5, h.y); ctx.lineTo(x + 17, GY); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  }
  for (const it of items) if (!it.got) drawItem(it);
  for (const e of enemies) if (e.x > camX - 60 && e.x < camX + W + 60) drawEnemy(e);
  for (const f of fires) { ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(f.x + 5, f.y + 5, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(f.x + 5, f.y + 5, 3, 0, 7); ctx.fill(); }
  if (!(p.inv > 0 && Math.floor(t / 5) % 2)) drawPlayer();
  ctx.restore();

  const st = [];
  if (p.big) st.push('🍄');
  if (p.star > 0) st.push('⭐ ' + Math.ceil(p.star / 60) + 's');
  if (p.ammo > 0) st.push('🔥 ' + p.ammo);
  $('status').textContent = st.join('  ');
  $('score').textContent = 'Điểm: ' + score() + ' · Cấp ' + lvl() + ' · Quái ×' + spd().toFixed(1);
  $('lives').textContent = '♥'.repeat(Math.max(lives, 0)) + '♡'.repeat(Math.max(3 - lives, 0));
}

// ---- Vòng lặp chính (bước cố định 60Hz) ----
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60) { if (state === 'play') update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
$('msg').textContent = START_MSG;
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
